# 效率工具箱 nginx 配置示例
# 放到 /etc/nginx/sites-available/tools.sheyinglai.top，再软链到 sites-enabled：
#   sudo ln -s /etc/nginx/sites-available/tools.sheyinglai.top /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 之后执行 certbot --nginx -d tools.sheyinglai.top，certbot 会自动追加 443 / 证书配置与 http→https 跳转。

server {
    listen 80;
    listen [::]:80;
    server_name tools.sheyinglai.top;

    # nuxt generate 产出的静态文件（.output/public）
    root /var/www/tools;
    index index.html;

    charset utf-8;

    # gzip 压缩文本类资源
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 带 hash 的构建产物：长期强缓存
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 页面：/json-formatter -> /json-formatter/index.html；找不到时返回 404.html（由前端渲染 404 页面）
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # HTML 与 payload 不缓存，保证发布后立即生效
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 其他静态资源（favicon、robots.txt、sitemap.xml 等）短期缓存
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|txt|xml|xsl)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
