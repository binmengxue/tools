# 效率工具箱 nginx 配置示例（与 sheyinglai.top 相同的做法：阿里云免费证书 + 手写 443）
# 服务器上的位置：/etc/nginx/sites-available/tools，软链到 /etc/nginx/sites-enabled/tools
# 证书：阿里云免费证书（Nginx 格式），上传到 /etc/nginx/cert/ 下，文件名与下面 ssl_certificate 一致。
# 注意：要先上传证书再启用本配置，否则 nginx -t 会因找不到证书文件而失败。

# http 统一跳转到 https
server {
    listen 80;
    server_name tools.sheyinglai.top;
    return 301 https://tools.sheyinglai.top$request_uri;
}

server {
    listen 443 ssl;
    server_name tools.sheyinglai.top;

    ssl_certificate     /etc/nginx/cert/tools.sheyinglai.top.pem;
    ssl_certificate_key /etc/nginx/cert/tools.sheyinglai.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_tools:10m;
    ssl_session_timeout 1d;

    # nuxt generate 产出的静态文件（.output/public）
    root /var/www/tools;
    index index.html;

    charset utf-8;

    # gzip 压缩文本类资源
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 带 hash 的构建产物：长期强缓存
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 页面：/json-formatter -> /json-formatter/index.html；找不到时返回 404.html（由前端渲染 404 页面）
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # HTML 与 payload 不缓存，保证发布后立即生效
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 其他静态资源（favicon、robots.txt、sitemap.xml 等）短期缓存
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|txt|xml|xsl)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
